name: Build, Test, and Deploy the Docker image and "pacsifier" package

# Tier 2 (build + integration tests): runs on PRs touching code/packaging and on
# master. No secrets are needed or exposed here.
# Tier 4 (deploy): runs only when a GitHub Release is published, in a separate job
# that is the only place the registry/PyPI secrets are used.
on:
  pull_request:
    paths:
      - .github/workflows/build-test-deploy.yml
      - .coveragerc
      - .pytest.ini
      - .releaserc.json
      - get_container_name.py
      - get_version.py
      - Dockerfile
      - Makefile
      - pyproject.toml
      - setup.py
      - setup.cfg
      - environment/**
      - pacsifier/**
      - scripts/**
      - tests/**
      - utils/**
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

# A new push to a PR supersedes the previous run; never cancel master or release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install wheel

      - name: Validate the .zenodo.json file
        run: |
          make validate-zenodo

      - name: Build Docker image
        run: |
          make build-docker

      - name: Test to build and install the package wheel
        run: |
          make install-python-wheel
          pacsifier --version

      - name: Run PyTest tests via the Docker image built previously
        run: |
          make test

  deploy:
    # Release only. Needs the test job to have passed on the same release commit.
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Configure required reviewers on the "release" environment in the repository
    # settings to add a manual approval before anything is published.
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          pip install wheel twine

      - name: Check the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python get_version.py)
          if [ "${RELEASE_TAG#v}" != "${VERSION}" ]; then
            echo "Release tag '${RELEASE_TAG}' does not match pacsifier/info.py version '${VERSION}'." >&2
            echo "Bump the version (make bump-version V=...) and re-tag before releasing." >&2
            exit 1
          fi

      - name: Extract container name, version, and build date
        run: |
          echo "CONTAINER_NAME=$(python get_container_name.py)" >> "$GITHUB_ENV"
          echo "VERSION=$(python get_version.py)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Build the package
        run: |
          python setup.py sdist bdist_wheel

      - name: Deploy Python package to TestPyPI first
        env:
          TWINE_USERNAME: ${{ secrets.TESTPYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_PASSWORD }}
        run: |
          twine upload --skip-existing --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Deploy Python package to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          twine upload --skip-existing dist/*

      - name: Set image name
        env:
          QUAY_SERVER: ${{ secrets.QUAY_SERVER }}
          QUAY_NAMESPACE: ${{ secrets.QUAY_NAMESPACE }}
        run: |
          echo "IMAGE_NAME=${QUAY_SERVER}/${QUAY_NAMESPACE}/${CONTAINER_NAME}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.QUAY_SERVER }}
          username: ${{ secrets.QUAY_ROBOT_ID }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Push the Docker image to Quay.io
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          provenance: false
