name: Container scan

on:
  pull_request:
    paths:
      - Dockerfile
      - environment/**
      - .github/workflows/container-scan.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - environment/**

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build image for scanning
        run: |
          VERSION=$(python get_version.py)
          docker build --build-arg VERSION="${VERSION}" -t pacsifier:scan .

      - name: Trivy (OS and app packages in image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pacsifier:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
