name: Lint and security

on:
  pull_request:
    paths:
      - "pacsifier/**"
      - "tests/**"
      - "setup.cfg"
      - "setup.py"
      - "pyproject.toml"
      - "requirements-security-audit.txt"
      - "Dockerfile"
      - ".github/workflows/lint-security.yml"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and security tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install ".[test]" ruff bandit "pip-audit>=2.9"

      - name: Ruff (syntax / definite errors)
        run: ruff check pacsifier tests --select E9,F63,F7,F82

      - name: Bandit
        run: bandit -r pacsifier -ll

      - name: pip-audit (declared pins)
        run: pip-audit -r requirements-security-audit.txt --no-deps
