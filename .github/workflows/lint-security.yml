name: Lint and security

on:
  pull_request:
    paths:
      - "pacsifier/**"
      - "tests/**"
      - "setup.cfg"
      - "setup.py"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/lint-security.yml"
  push:
    branches:
      - master
  # New advisories appear against unchanged code: re-audit weekly on the default branch.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package (all extras) and security tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip install ".[all]" ruff bandit "pip-audit>=2.9"

      - name: Ruff (syntax / definite errors)
        run: ruff check pacsifier tests --select E9,F63,F7,F82

      # Docker wrappers pin the image version; keep them in sync with info.py.
      - name: Version consistency (wrappers vs info.py)
        run: |
          pip install pytest
          python -m pytest --noconftest -c /dev/null -p no:cacheprovider tests/test_version_consistency.py

      - name: Bandit
        run: bandit -r pacsifier -ll

      # Audits the whole installed environment, transitive dependencies included
      # (e.g. urllib3 behind requests), not only the pins declared in setup.cfg.
      - name: pip-audit (installed environment)
        run: pip-audit --skip-editable
